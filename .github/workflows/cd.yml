name: CD

on:
  push:
    branches: [main]

# Workload Identity Federation 을 위해 id-token 권한 필요
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ai-chat-492509
  REGION: asia-northeast3
  SERVICE: daily-report
  REGISTRY: asia-northeast3-docker.pkg.dev

jobs:
  # ────────────────────────────────────────────────────────────────
  # Job 1: CI (lint · format · test)
  # ────────────────────────────────────────────────────────────────
  ci:
    name: Lint · Format · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

  # ────────────────────────────────────────────────────────────────
  # Job 2: Build → Push → Deploy (CI 통과 후 실행)
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      # Workload Identity Federation 으로 GCP 인증 (키 파일 없음)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Artifact Registry 에 대한 Docker 인증 설정
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      # 이미지 빌드 및 푸시
      - name: Build and push Docker image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/app"
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      # Cloud Run 배포
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/app:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --min-instances=0
            --max-instances=10
            --memory=512Mi
            --cpu=1
            --port=3000
            --concurrency=80
          # 민감 정보는 Secret Manager 에서 주입
          secrets: |
            DATABASE_URL=DATABASE_URL:latest
            JWT_SECRET=JWT_SECRET:latest

      - name: Show deployed URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
